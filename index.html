<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Kaixa - Soluções em Sistemas</title>
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Container Principal -->
    <main class="max-w-md mx-auto px-4 py-16 w-full flex flex-col items-center flex-grow">
        
        <!-- Logo / Identidade -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-2xl shadow-lg shadow-indigo-500/30 mb-4 text-3xl font-extrabold tracking-wider">
                K
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Grupo Kaixa</h1>
            <p class="text-slate-400 text-sm mt-1">Escolha a solução ideal para o seu negócio</p>
        </div>

        <!-- Links / Botões de Redirecionamento -->
        <div class="w-full space-y-4">
            
            <!-- Botão KaixaAgenda -->
            <a href="https://kaixaagenda.com.br" target="_blank" rel="noopener noreferrer" 
               class="group relative flex items-center p-4 bg-slate-900 border border-slate-800 rounded-xl hover:border-indigo-500 hover:bg-slate-850 transition-all duration-300 shadow-md hover:shadow-indigo-500/10">
                <div class="flex-shrink-0 w-12 h-12 bg-indigo-500/10 text-indigo-400 rounded-lg flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
                    📅
                </div>
                <div class="ml-4 flex-grow">
                    <h2 class="font-semibold text-slate-200 group-hover:text-indigo-400 transition-colors">KaixaAgenda</h2>
                    <p class="text-xs text-slate-400">Sistema de agendamento para salões e barbearias</p>
                </div>
                <div class="text-slate-500 group-hover:translate-x-1 transition-transform">
                    ➔
                </div>
            </a>

            <!-- Botão KaixaStore -->
            <a href="https://kaixastore.com.br" target="_blank" rel="noopener noreferrer" 
               class="group relative flex items-center p-4 bg-slate-900 border border-slate-800 rounded-xl hover:border-emerald-500 hover:bg-slate-850 transition-all duration-300 shadow-md hover:shadow-emerald-500/10">
                <div class="flex-shrink-0 w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-lg flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
                    🛒
                </div>
                <div class="ml-4 flex-grow">
                    <h2 class="font-semibold text-slate-200 group-hover:text-emerald-400 transition-colors">KaixaStore</h2>
                    <p class="text-xs text-slate-400">PDV, controle de estoque e catálogo digital</p>
                </div>
                <div class="text-slate-500 group-hover:translate-x-1 transition-transform">
                    ➔
                </div>
            </a>

        </div>
    </main>

    <!-- Rodapé -->
    <footer class="w-full text-center py-6 text-xs text-slate-600 border-t border-slate-900">
        &copy; 2026 Grupo Kaixa. Todos os direitos reservados.
    </footer>

</body>
</html>
